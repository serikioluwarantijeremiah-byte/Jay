{% extends 'base.html' %}
{% load static %}
{% block styles %}
<style>
    body {
        background: linear-gradient(to bottom, #7b2ff7 0%, #5f1ecf 45%, #ffffff 50%, #2c003e 55%, #14001f 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-card {
        background: rgba(255,255,255,0.97);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 16px 50px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 420px;
        margin: 2rem auto;
    }

    .login-title {
        font-size: 1.8rem;
        font-weight: 800;
        background: linear-gradient(to right, #7b2ff7, #00c6ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.3rem;
    }

    .login-subtitle {
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 1.8rem;
    }

    .form-control {
        border-radius: 12px;
        border: 2px solid #e0d0ff;
        padding: 12px 16px;
        font-size: 0.95rem;
        transition: 0.3s;
    }

    .form-control:focus {
        border-color: #7b2ff7;
        box-shadow: 0 0 0 3px rgba(123,47,247,0.1);
    }

    .form-label {
        font-weight: 600;
        color: #3a3a5c;
        font-size: 0.9rem;
    }

    .btn-login {
        width: 100%;
        padding: 13px;
        border-radius: 30px;
        background: linear-gradient(135deg, #7b2ff7, #4facfe);
        color: white;
        border: none;
        font-size: 1rem;
        font-weight: 700;
        margin-top: 1rem;
        transition: 0.3s;
    }

    .btn-login:hover {
        opacity: 0.88;
        transform: scale(1.01);
    }

    .logo-top {
        text-align: center;
        margin-bottom: 1.5rem;
    }

    .logo-top img {
        height: 55px;
        width: auto;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-card">

    <div class="logo-top">
        <img src="{% static 'images/logo.jpeg' %}" alt="ROLZAY">
    </div>

    <div class="login-title">Welcome Back</div>
    <div class="login-subtitle">Sign in to manage your store</div>

    {% if messages %}
        {% for msg in messages %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter username"
                   required autofocus>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password"
                   required>
        </div>

        <button type="submit" class="btn btn-login">
            Sign In →
        </button>
    </form>
</div>
{% endblock %}
