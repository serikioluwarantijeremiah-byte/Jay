{% extends 'base.html' %}
{% load static %}

{% block styles %}
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 12%, transparent 25%), linear-gradient(to bottom,
        #7b2ff7 0%,
        #5f1ecf 45%,
        #ffffff 50%,
        #2c003e 55%,
        #14001f 100%);
    }

    .brand-box {
        display: flex;
        align-items: center;
        gap: 18px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        padding: 20px 34px;
        border-radius: 60px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18), 0 0 25px rgba(255, 255, 255, 0.2);
        transition: 0.4s ease;
    }

    .brand-box:hover {
        transform: translateY(-6px) scale(1.02);
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.25), 0 0 40px rgba(123, 47, 247, 0.35);
    }

    .brand-name {
        font-size: 3rem;
        font-weight: 800;
        background: linear-gradient(to right,
        #7b2ff7,
        #00c6ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 2px;
    }

    .arrow {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        background: linear-gradient(135deg,
        #7b2ff7,
        #4facfe);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        text-decoration: none;
        font-size: 1.6rem;
        font-weight: bold;
        box-shadow: 0 5px 18px rgba(123, 47, 247, 0.4);
        transition: 0.3s ease;
    }

    .arrow:hover {
        transform: scale(1.12) rotate(5deg);
        box-shadow: 0 8px 25px rgba(79, 172, 254, 0.6);
    }

    @media (max-width: 600px) {
        .brand-box {
            padding: 14px 22px;
            gap: 12px;
        }

        .brand-name {
            font-size: 1.7rem;
        }

        .arrow {
            width: 45px;
            height: 45px;
            font-size: 1.2rem;
        }

        .brand-box img {
            height: 45px !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="brand-box">
    <img src="{% static 'images/logo.jpeg' %}" style="height:60px; width:auto;" alt="ROLZAY">
    <div class="brand-name">ROLZAY</div>
    <a href="{% url 'products:list' %}" class="arrow">→</a>
</div>
{% endblock %}
