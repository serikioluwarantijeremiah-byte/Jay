{% load static %}
<nav class="navbar navbar-expand-lg" style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);">
    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">
            <img src="{% static 'images/logo.jpeg' %}" height="36" alt="ROLZAY">
        </a>

        <div class="ms-auto d-flex align-items-center gap-3">
            <a href="{% url 'products:list' %}"
               style="color:white; text-decoration:none; font-weight:600;">
                Products
            </a>

            {% if user.is_authenticated %}
                <a href="{% url 'accounts:dashboard' %}"
                   style="color:white; text-decoration:none; font-weight:600;">
                    Dashboard
                </a>
                <a href="{% url 'accounts:logout' %}"
                   style="color:white; text-decoration:none; font-weight:600;">
                    Logout
                </a>
            {% else %}
                <a href="{% url 'accounts:login' %}"
                   style="background: linear-gradient(135deg, #7b2ff7, #4facfe);
                          color: white;
                          padding: 8px 20px;
                          border-radius: 30px;
                          text-decoration: none;
                          font-weight: 600;">
                    Login
                </a>
            {% endif %}
        </div>

    </div>
</nav>
